<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Orbit Simulation | Talshyn Jarassova</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05080e;color:#e8edf3;
font:14px -apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:22px 32px;border-bottom:1px solid #26303b;
display:flex;justify-content:space-between;gap:20px}
h1{font-size:17px;font-weight:550;margin:0}
small{color:#8796a9}
main{display:grid;grid-template-columns:1fr 260px;min-height:85vh}
canvas{width:100%;height:80vh;display:block}
aside{padding:26px;border-left:1px solid #26303b}
label{display:block;color:#9eacbb;margin:28px 0 12px}
input{width:100%;accent-color:#d8e4ef}
.value{float:right;color:white}
.metric{border-top:1px solid #26303b;padding:18px 0}
.metric strong{display:block;font-size:24px;margin-top:8px}
button{background:#e8edf3;border:0;padding:12px 20px;
cursor:pointer;border-radius:4px}
footer{padding:15px 32px;color:#8390a0}
@media(max-width:700px){
main{grid-template-columns:1fr}
canvas{height:55vh}
aside{border-left:0}
}
</style>
</head>
<body>
<header>
<h1>ORBITAL <small>/ Satellite Orbit Simulation</small></h1>
<small>Talshyn Jarassova · 2026</small>
</header>
<main>
<canvas id="space"></canvas>
<aside>
<small>ORBIT PARAMETERS</small>
<label>Altitude <span class="value" id="altval">500 km</span></label>
<input id="alt" type="range" min="200" max="2000" value="500" step="50">
<label>Inclination <span class="value" id="incval">45°</span></label>
<input id="inc" type="range" min="0" max="180" value="45">
<label>Simulation speed <span class="value" id="rateval">100×</span></label>
<input id="rate" type="range" min="10" max="1000" value="100" step="10">
<div class="metric">ORBITAL VELOCITY<strong id="velocity"></strong></div>
<div class="metric">ORBITAL PERIOD<strong id="period"></strong></div>
<button id="pause">Pause simulation</button>
<p><small>Drag to rotate camera · Scroll to zoom</small></p>
</aside>
</main>
<footer>Two-body circular orbit model · Earth radius 6371 km · μ = 398600.4418 km³/s²</footer>
<script>
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let yaw=-0.35,pitch=0.3,zoom=1,phase=0,spin=0;
let running=true,last=0,drag=false,px=0,py=0;
const R=6371,MU=398600.4418;
function project(p,cx,cy,s){
 let [x,y,z]=p;
 let X=x*Math.cos(yaw)-z*Math.sin(yaw);
 let Z=x*Math.sin(yaw)+z*Math.cos(yaw);
 let Y=y*Math.cos(pitch)-Z*Math.sin(pitch);
 return [cx+X*s,cy-Y*s];
}
function line(points,color,width,cx,cy,s){
 ctx.beginPath();
 points.forEach((p,i)=>{
  const q=project(p,cx,cy,s);
  i?ctx.lineTo(...q):ctx.moveTo(...q);
 });
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function render(ts){
 const dt=last?Math.min((ts-last)/1000,.1):0;last=ts;
 const w=canvas.clientWidth,h=canvas.clientHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
  canvas.width=w*dpr;canvas.height=h*dpr;
 }
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,w,h);
 const cx=w/2,cy=h/2;
 const altitude=+$("alt").value;
 const inclination=+$("inc").value*Math.PI/180;
 const rate=+$("rate").value;
 const radius=R+altitude;
 const period=2*Math.PI*Math.sqrt(radius**3/MU);
 $("altval").textContent=altitude+" km";
 $("incval").textContent=$("inc").value+"°";
 $("rateval").textContent=rate+"×";
 $("velocity").textContent=Math.sqrt(MU/radius).toFixed(3)+" km/s";
 $("period").textContent=(period/60).toFixed(2)+" min";
 if(running){phase+=dt*rate*2*Math.PI/period;spin+=dt*.035}
 const s=Math.min(w/2.7,h/2.5)/(R*1.28)*zoom;
 const glow=ctx.createRadialGradient(cx,cy,R*s*.5,cx,cy,R*s*1.3);
 glow.addColorStop(0,"#173b59");
 glow.addColorStop(1,"#05080e");
 ctx.fillStyle=glow;
 ctx.beginPath();ctx.arc(cx,cy,R*s*1.3,0,Math.PI*2);ctx.fill();
 const earth=ctx.createRadialGradient(cx-R*s*.35,cy-R*s*.4,5,cx,cy,R*s);
 earth.addColorStop(0,"#357ca4");
 earth.addColorStop(.65,"#16466d");
 earth.addColorStop(1,"#06192e");
 ctx.fillStyle=earth;
 ctx.beginPath();ctx.arc(cx,cy,R*s,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*s,0,Math.PI*2);ctx.clip();
 for(let lat=-75;lat<=75;lat+=15){
  const pts=[];
  for(let lon=0;lon<=360;lon+=3){
   const a=lat*Math.PI/180,b=lon*Math.PI/180+spin;
   const p=[R*Math.cos(a)*Math.cos(b),R*Math.sin(a),
            R*Math.cos(a)*Math.sin(b)];
   if(p[2]*Math.cos(yaw)+p[0]*Math.sin(yaw)>=0)pts.push(p);
   else if(pts.length>1){line(pts,"#39769a",.65,cx,cy,s);pts.length=0}
  }
  if(pts.length>1)line(pts,"#39769a",.65,cx,cy,s);
 }
 ctx.restore();
 function orbitPoint(t){
  return [radius*Math.cos(t),
  radius*Math.sin(t)*Math.sin(inclination),
  radius*Math.sin(t)*Math.cos(inclination)];
 }
 const pts=Array.from({length:241},(_,i)=>orbitPoint(i*Math.PI/120));
 line(pts,"#b7c7d6",1.4,cx,cy,s);
 const sat=project(orbitPoint(phase),cx,cy,s);
 ctx.fillStyle="#fff4c5";ctx.beginPath();
 ctx.arc(sat[0],sat[1],5,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#f7d88c";ctx.strokeRect(sat[0]-8,sat[1]-2,16,4);
 requestAnimationFrame(render);
}
canvas.addEventListener("pointerdown",e=>{
 drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)
});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 yaw+=(e.clientX-px)*.007;
 pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-py)*.007));
 px=e.clientX;py=e.clientY;
});
canvas.addEventListener("wheel",e=>{
 e.preventDefault();
 zoom=Math.max(.5,Math.min(2.5,zoom*(e.deltaY>0?.92:1.08)));
},{passive:false});
$("pause").onclick=()=>{
 running=!running;
 $("pause").textContent=running?"Pause simulation":"Resume simulation";
};
requestAnimationFrame(render);
</script>
</body>
</html>
